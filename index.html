<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b16">
<title>MaMaLiX Shop — Update</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#20204b 0%,#101329 35%,#090b16 75%);color:#f7f7ff;font-family:Inter,system-ui,sans-serif}
.glow{position:fixed;width:360px;height:360px;border-radius:50%;filter:blur(110px);opacity:.24;pointer-events:none}.one{background:#7956ff;top:-180px;left:-100px}.two{background:#00c8e8;bottom:-220px;right:-100px}
main{position:relative;text-align:center;padding:55px 25px;max-width:900px;width:100%;animation:enter 1s cubic-bezier(.2,.8,.2,1) both}
.logo{width:82px;height:82px;margin:0 auto 30px;border-radius:26px;display:grid;place-items:center;font-size:38px;font-weight:900;background:linear-gradient(135deg,#8b5cf6,#22d3ee);box-shadow:0 0 55px #8b5cf655;animation:bob 4s ease-in-out infinite}
h1{font-size:clamp(34px,7vw,66px);line-height:1.12;letter-spacing:-2.8px;margin:0;font-weight:900;background:linear-gradient(95deg,#fff 15%,#c4b5fd 52%,#67e8f9 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.message{margin:25px 0 0;color:#e1e4f7;font-size:clamp(16px,2.5vw,21px);font-weight:600;letter-spacing:.1px}
.wait{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:17px;color:#9ca8c8;font-size:14px}
.wait i{width:5px;height:5px;background:#67e8f9;border-radius:50%;animation:pulse 1.2s infinite}.wait i:nth-child(2){animation-delay:.2s}.wait i:nth-child(3){animation-delay:.4s}
.version{margin-top:48px;display:inline-block;padding:9px 17px;border:1px solid #a78bfa55;background:#8b5cf61a;border-radius:30px;color:#c4b5fd;font-size:12px;font-weight:800;letter-spacing:2.5px}
.line{width:90px;height:2px;margin:28px auto 0;border-radius:5px;background:linear-gradient(90deg,transparent,#8b5cf6,#22d3ee,transparent);opacity:.8}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1.2)}}
</style>
</head>
<body>
<div class="glow one"></div><div class="glow two"></div>
<main>
  <div class="logo">M</div>
  <h1>MaMaLiX Shop<br>New Version!</h1>
  <p class="message">A new update is coming soon. Stay tuned!</p>
  <div class="wait">PLEASE WAIT <i></i><i></i><i></i></div>
  <div class="version">V1.0.2</div>
  <div class="line"></div>
</main>
</body>
</html>
