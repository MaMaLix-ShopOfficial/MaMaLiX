<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0905" />
  <title>نسل جدید MaMaLiX | نسخه 1.0.1</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
    :root {
      --gold: #f4c95d;
      --gold-light: #fff0b0;
      --gold-deep: #a87516;
      --bg: #080705;
      --muted: #b8ad91;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; color: #fff8e5; font-family: 'Vazirmatn', Tahoma, sans-serif;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(160,111,20,.18), transparent 43%),
        radial-gradient(circle at 12% 12%, rgba(244,201,93,.08), transparent 25%),
        var(--bg);
      overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .12;
      background-image: linear-gradient(rgba(244,201,93,.15) 1px, transparent 1px), linear-gradient(90deg, rgba(244,201,93,.15) 1px, transparent 1px);
      background-size: 56px 56px; mask-image: linear-gradient(to bottom, black, transparent 85%);
    }
    .noise { position: fixed; inset: 0; pointer-events: none; opacity: .035; z-index: 1; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E"); }
    .page { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; }
    header { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; gap: 11px; align-items: center; font-weight: 900; letter-spacing: 1px; direction: ltr; }
    .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid rgba(244,201,93,.65); border-radius: 12px; color: var(--gold-light); box-shadow: inset 0 0 18px rgba(244,201,93,.1), 0 0 22px rgba(244,201,93,.08); }
    .brand-name { font-size: 19px; background: linear-gradient(120deg,#fff3bc,#d9a52d 55%,#fff0a0); color: transparent; background-clip: text; }
    .top-label { color: var(--muted); font-size: 12px; border: 1px solid rgba(244,201,93,.2); border-radius: 999px; padding: 8px 13px; }
    main { flex: 1; display: grid; place-items: center; padding: 35px 20px 70px; }
    .hero { width: min(900px, 100%); text-align: center; position: relative; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--gold); border: 1px solid rgba(244,201,93,.28); background: rgba(244,201,93,.055); border-radius: 999px; padding: 9px 16px; font-size: 12px; letter-spacing: .5px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #f4c95d; box-shadow: 0 0 12px #f4c95d; animation: pulse 1.8s infinite; }
    .emblem { width: 136px; height: 136px; margin: 34px auto 25px; position: relative; display: grid; place-items: center; }
    .emblem::before, .emblem::after { content: ''; position: absolute; inset: 0; border: 1px solid rgba(244,201,93,.55); border-radius: 34px; transform: rotate(45deg); box-shadow: 0 0 35px rgba(244,201,93,.08), inset 0 0 30px rgba(244,201,93,.04); }
    .emblem::after { inset: 12px; border-color: rgba(244,201,93,.23); border-radius: 27px; transform: rotate(0deg); }
    .emblem span { z-index: 1; font-size: 42px; font-weight: 900; color: var(--gold-light); text-shadow: 0 0 30px rgba(244,201,93,.45); }
    h1 { margin: 0; font-size: clamp(34px, 6vw, 68px); font-weight: 900; line-height: 1.45; letter-spacing: -.8px; }
    h1 .gold { display: block; direction: ltr; background: linear-gradient(110deg,#fff4bd 10%,#f4c95d 45%,#a87516 70%,#ffe99b 90%); background-size: 220% auto; color: transparent; background-clip: text; animation: shine 6s linear infinite; }
    .subtitle { margin: 14px auto 0; color: #c5baa0; font-size: clamp(14px, 2vw, 17px); line-height: 2; max-width: 550px; }
    .version-card { display: inline-flex; align-items: center; gap: 15px; margin-top: 32px; padding: 13px 19px; border: 1px solid rgba(244,201,93,.32); border-radius: 16px; background: linear-gradient(135deg,rgba(244,201,93,.09),rgba(255,255,255,.018)); box-shadow: 0 12px 45px rgba(0,0,0,.22); }
    .version-icon { width: 37px; height: 37px; display: grid; place-items: center; border-radius: 11px; background: rgba(244,201,93,.13); color: var(--gold); }
    .version-text { text-align: right; }
    .version-text small { display: block; color: #a99c7e; font-size: 11px; margin-bottom: 2px; }
    .version-text strong { direction: ltr; display: block; font-size: 15px; color: var(--gold-light); letter-spacing: 0; }
    .divider { width: 90px; height: 1px; margin: 36px auto 22px; background: linear-gradient(90deg,transparent,var(--gold-deep),transparent); }
    .bottom-note { font-size: 12px; color: #897e64; }
    .bottom-note span { color: var(--gold); }
    footer { text-align: center; padding: 20px; color: #72684f; font-size: 11px; border-top: 1px solid rgba(244,201,93,.1); }
    .spark { position: absolute; width: 4px; height: 4px; background: var(--gold-light); border-radius: 50%; box-shadow: 0 0 12px 2px rgba(244,201,93,.6); animation: float 5s ease-in-out infinite; }
    .s1 { top: 19%; left: 12%; } .s2 { top: 44%; right: 8%; animation-delay: -2s; } .s3 { bottom: 19%; left: 20%; animation-delay: -3s; } .s4 { bottom: 25%; right: 17%; animation-delay: -1s; }
    @keyframes pulse { 50% { opacity: .4; box-shadow: 0 0 3px #f4c95d; } }
    @keyframes shine { to { background-position: 220% center; } }
    @keyframes float { 0%,100% { transform: translateY(0); opacity: .35; } 50% { transform: translateY(-13px); opacity: 1; } }
    @media (max-width: 560px) {
      header { width: calc(100% - 28px); padding: 20px 0; }
      .top-label { font-size: 10px; padding: 7px 10px; }
      .brand-name { font-size: 16px; }
      .emblem { width: 112px; height: 112px; margin-top: 30px; }
      .emblem span { font-size: 35px; }
      main { padding-top: 22px; }
      .spark { opacity: .5; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="page">
    <header>
      <div class="brand"><div class="brand-mark">M</div><span class="brand-name">MaMaLiX</span></div>
      <div class="top-label">تجربه‌ای تازه در راه است</div>
    </header>
    <main>
      <section class="hero" aria-labelledby="headline">
        <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i>
        <div class="eyebrow"><span class="live-dot"></span> به‌روزرسانی جدید</div>
        <div class="emblem" aria-hidden="true"><span>M</span></div>
        <h1 id="headline">نسل جدید <span class="gold">MaMaLiX</span></h1>
        <p class="subtitle">شروعی تازه، ظاهری متفاوت و تجربه‌ای درخشان‌تر.<br>به نسخه جدید Mamalix خوش آمدید.</p>
        <div class="version-card">
          <div class="version-icon">✦</div>
          <div class="version-text"><small>وضعیت به‌روزرسانی سایت</small><strong>در حال آپدیت به ورژن ۱.۰.۱</strong></div>
        </div>
        <div class="divider"></div>
        <div class="bottom-note">ساخته‌شده برای یک تجربه <span>طلایی</span></div>
      </section>
    </main>
    <footer>© <span id="year"></span> MaMaLiX — تمامی حقوق محفوظ است</footer>
  </div>
  <script>
    // سال جاری به‌صورت خودکار به‌روزرسانی می‌شود.
    document.getElementById('year').textContent = new Date().getFullYear();

    // افکت ملایم حرکت نور با حرکت اشاره‌گر
    const hero = document.querySelector('.hero');
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      hero.addEventListener('pointermove', (event) => {
        const rect = hero.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width - 0.5) * 8;
        const y = ((event.clientY - rect.top) / rect.height - 0.5) * 8;
        hero.style.setProperty('--tilt-x', `${y}deg`);
        hero.style.setProperty('--tilt-y', `${x}deg`);
      });
    }
  </script>
</body>
</html>
